name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Captain version / image tag
  - type: input
    id: docker
    attributes:
      label: Docker version and OS
      placeholder: "Docker 27.3.1, Debian 12, arm64"
  - type: textarea
    id: logs
    attributes:
      label: Container logs
      description: Output of `docker logs captain` (remove anything private).
      render: shell
