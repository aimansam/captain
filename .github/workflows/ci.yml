name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server tests
        working-directory: server
        run: |
          npm install
          npm test
      - name: Build web
        working-directory: web
        run: |
          npm install
          npm run build
      - name: Build image
        run: docker build -t captain:ci .
