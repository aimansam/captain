    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Captain: Docker container security</title>
    <script>
      // Apply a saved theme before first paint to avoid a flash.
      try { var t = localStorage.getItem('captain-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
